# ==============================================================================
# RKN Associates — nginx vhost rewrite rules for clean URLs
# Paste this inside the server { ... } block of your CloudPanel Vhost.
# Go to CloudPanel → Sites → rknassociates.com → Vhost, edit, paste below
# the existing "root" and "index" directives, and click Save.
# ==============================================================================

# --- 1. Canonical redirects: /index.html and /*.html -> clean URLs ---
location = /index.html { return 301 /home; }
location = /about.html    { return 301 /about; }
location = /services.html { return 301 /services; }
location = /projects.html { return 301 /projects; }
location = /contact.html  { return 301 /contact; }

# --- 2. Clean URL routing: /home, /about, etc. serve the .html files ---
location = /home     { try_files /index.html    =404; }
location = /about    { try_files /about.html    =404; }
location = /services { try_files /services.html =404; }
location = /projects { try_files /projects.html =404; }
location = /contact  { try_files /contact.html  =404; }

# --- 3. Root "/" also serves the homepage (no redirect, fastest load) ---
# The existing "index index.html;" directive handles this automatically.
# If you want rknassociates.com to 301-redirect to rknassociates.com/home
# instead, uncomment the next 3 lines and delete "index index.html;" from
# the main config (not recommended for SEO — root is usually canonical).
# location = / {
#     return 301 /home;
# }

# --- 4. Custom 404 page ---
error_page 404 /404.html;
location = /404.html { internal; }

# --- 5. Long cache for static assets (images, CSS, JS, fonts) ---
location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|css|js)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    access_log off;
}

# --- 6. Block hidden files (except .well-known for Let's Encrypt) ---
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
}

# --- 7. Security headers (applied to all responses) ---
add_header X-Content-Type-Options        "nosniff" always;
add_header X-Frame-Options               "SAMEORIGIN" always;
add_header Referrer-Policy               "strict-origin-when-cross-origin" always;
add_header Permissions-Policy            "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security     "max-age=31536000; includeSubDomains" always;

# --- 8. Gzip compression (if not already enabled globally) ---
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/json
    image/svg+xml;

# ==============================================================================
# End of RKN Associates nginx rules
# ==============================================================================
